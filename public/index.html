<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f4">
  <title>Monitoring Suhu Kamar</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="header">
      <div>
        <p class="eyebrow">MONITORING RUANGAN</p>
        <h1>Kondisi Kamar</h1>
        <p class="subtitle">Pemantauan suhu dan kelembapan secara langsung.</p>
      </div>
      <div class="status">
        <span id="statusDot" class="dot"></span>
        <span id="statusText">Menghubungkan sensor...</span>
      </div>
    </header>

    <section class="room-info">
      <div>
        <span class="room-label">Luas ruangan</span>
        <strong>15 m&#178;</strong>
      </div>
      <span class="room-size">5 m &#215; 3 m</span>
    </section>

    <section class="readings">
      <article class="reading-card">
        <div class="card-heading">
          <span>Suhu ruangan</span>
          <span class="symbol">&#176;C</span>
        </div>
        <div class="value-line">
          <strong id="temperature">--.-</strong>
          <span>&#176;C</span>
        </div>
        <p id="temperatureStatus" class="reading-note">Menunggu data sensor</p>
      </article>

      <article class="reading-card">
        <div class="card-heading">
          <span>Kelembapan udara</span>
          <span class="symbol">RH</span>
        </div>
        <div class="value-line">
          <strong id="humidity">--</strong>
          <span>%</span>
        </div>
        <p class="reading-note">Kelembapan relatif udara</p>
      </article>
    </section>

    <footer>
      <span>Sensor ESP32-S3 + DHT22</span>
      <span id="lastUpdate">Belum menerima data</span>
    </footer>
  </main>
  <script src="/ac-weather-control.js" defer></script>
</body>
</html>
